<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spellbound</title>
<style>
  :root{
    --void:#0b0910; --shadow:#17141f; --stone-d:#2b2739; --stone-m:#443f57;
    --stone-l:#676078; --stone-h:#938ca0; --wood-m:#6b4227; --wood-l:#a86b3c;
    --flame-d:#c2531f; --flame-m:#f0a447; --flame-l:#ffd98a;
    --robe-m:#2f5d8a; --robe-l:#4a8fc7; --gob-l:#7cb551;
    --blood-m:#a32b2b; --blood-l:#d94f4f; --bone:#e8e0d0;
    --ink:#cfc9d8; --ink-dim:#8b8399;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--void); color:var(--ink);
    font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    overflow:hidden;
  }
  button{font:inherit;cursor:pointer}

  /* ---------- shell ---------- */
  #app{display:grid;grid-template-columns:minmax(0,1fr) 460px;height:100vh}
  @media (max-width:1100px){ #app{grid-template-columns:1fr;grid-template-rows:1fr auto;overflow:auto} }

  /* ---------- left: stage ---------- */
  #stage{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--stone-d)}
  #board{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:20px;min-height:0;
    background:
      radial-gradient(ellipse at 50% 40%, #1a1626 0%, var(--void) 70%);
  }
  canvas{
    image-rendering:pixelated; image-rendering:crisp-edges;
    max-width:100%;max-height:100%;
    border:1px solid var(--stone-d);
    box-shadow:0 12px 48px rgba(0,0,0,.6);
  }
  #hud{
    display:flex;gap:18px;align-items:center;padding:10px 18px;
    border-top:1px solid var(--stone-d);background:var(--shadow);
    font:12px/1 var(--mono);letter-spacing:.04em;flex-wrap:wrap
  }
  .stat{display:flex;align-items:center;gap:7px;color:var(--ink-dim)}
  .stat b{color:var(--ink);font-weight:600}
  .stat.torch b{color:var(--flame-m)}
  .stat.hp b{color:var(--blood-l)}
  .pips{display:flex;gap:2px}
  .pip{width:7px;height:7px;background:var(--blood-m);border-radius:1px}
  .pip.off{background:var(--stone-d)}
  #log{
    height:132px;overflow-y:auto;padding:10px 18px;
    border-top:1px solid var(--stone-d);background:#100e18;
    font:12px/1.7 var(--mono);color:var(--ink-dim)
  }
  #log .l{white-space:pre-wrap}
  #log .l.hit{color:var(--flame-m)}
  #log .l.bad{color:var(--blood-l)}
  #log .l.win{color:var(--gob-l)}
  #log .l.say{color:var(--robe-l)}

  /* ---------- right: panel ---------- */
  #panel{display:flex;flex-direction:column;min-height:0;background:var(--shadow)}
  #panel > * {border-bottom:1px solid var(--stone-d)}
  .head{
    display:flex;align-items:baseline;gap:10px;padding:13px 18px 11px;
  }
  .head .ch{font:10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--flame-d)}
  .head h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.01em}
  .head .n{margin-left:auto;font:11px/1 var(--mono);color:var(--ink-dim)}

  #brief{padding:0 18px 14px;font-size:13px;color:var(--ink)}
  #brief .teach{
    margin-top:9px;padding:9px 11px;border-left:2px solid var(--flame-d);
    background:rgba(240,164,71,.06);font-size:12.5px;color:var(--flame-l)
  }
  #brief .teach b{color:var(--flame-m)}

  /* editor */
  #edwrap{flex:1;display:flex;flex-direction:column;min-height:180px;position:relative}
  #edit{display:flex;flex:1;min-height:0;background:#100e18}
  #gutter{
    padding:12px 0 12px;width:44px;flex:none;text-align:right;
    font:13px/1.6 var(--mono);color:#4b445c;user-select:none;overflow:hidden
  }
  #gutter div{padding-right:10px}
  #gutter div.cur{color:var(--flame-m);background:rgba(240,164,71,.11)}
  #code{
    flex:1;min-width:0;padding:12px 14px 12px 4px;margin:0;border:0;outline:0;resize:none;
    background:transparent;color:var(--ink);font:13px/1.6 var(--mono);
    tab-size:2;white-space:pre;overflow:auto
  }
  #bar{display:flex;gap:8px;align-items:center;padding:10px 18px;background:var(--shadow)}
  .btn{
    padding:7px 15px;border:1px solid var(--stone-m);border-radius:4px;
    background:var(--stone-d);color:var(--ink);font-size:13px;font-weight:500
  }
  .btn:hover{background:var(--stone-m);border-color:var(--stone-l)}
  .btn.go{background:var(--flame-d);border-color:var(--flame-m);color:#fff}
  .btn.go:hover{background:var(--flame-m);color:var(--void)}
  .btn:disabled{opacity:.45;cursor:default}
  #bar .sp{margin-left:auto;font:11px var(--mono);color:var(--ink-dim)}

  /* spellbook */
  #book{max-height:230px;overflow-y:auto;background:#100e18}
  #book h2{
    margin:0;padding:11px 18px;font:10px/1 var(--mono);letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-dim);position:sticky;top:0;background:#100e18;
    border-bottom:1px solid var(--stone-d);cursor:pointer;user-select:none
  }
  #book h2::before{content:"▾ ";color:var(--stone-l)}
  #book.closed h2::before{content:"▸ "}
  #book.closed dl{display:none}
  #book dl{margin:0;padding:6px 18px 14px}
  #book dt{font:12.5px var(--mono);color:var(--flame-m);margin-top:9px}
  #book dd{margin:2px 0 0;font-size:12px;color:var(--ink-dim)}

  /* errors */
  #err{display:none;padding:11px 18px;background:rgba(163,43,43,.14);border-top:1px solid var(--blood-m)}
  #err.show{display:block}
  #err .msg{font-size:13px;color:#ffb3b3}
  #err .msg b{color:#fff}
  #err .raw{margin-top:7px;font:11px var(--mono);color:#a3899a;display:none}
  #err.open .raw{display:block}
  #err .tog{margin-top:6px;font-size:11px;color:var(--ink-dim);text-decoration:underline;background:none;border:0;padding:0}

  /* map screen */
  #map{position:fixed;inset:0;background:rgba(11,9,16,.96);z-index:20;overflow:auto;display:none}
  #map.show{display:block}
  #map .in{max-width:900px;margin:0 auto;padding:44px 24px 60px}
  #map h1{margin:0 0 4px;font-size:26px;letter-spacing:.02em}
  #map .sub{color:var(--ink-dim);margin-bottom:28px;font-size:13px}
  #map .chap{margin:26px 0 10px;font:10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--flame-d)}
  #map .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
  .card{
    text-align:left;padding:12px 14px;border:1px solid var(--stone-d);border-radius:5px;
    background:var(--shadow);color:var(--ink)
  }
  .card:hover:not(:disabled){border-color:var(--flame-d);background:var(--stone-d)}
  .card .t{font-weight:600;font-size:13.5px}
  .card .c{font:11px var(--mono);color:var(--flame-m);margin-top:3px}
  .card .s{font:11px var(--mono);color:var(--ink-dim);margin-top:5px}
  .card.done{border-color:#37613a}
  .card.done .t::after{content:" ✓";color:var(--gob-l)}
  .card:disabled{opacity:.4}
  #map .close{margin-top:32px}

  /* victory */
  #win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;background:rgba(11,9,16,.9)}
  #win.show{display:flex}
  #win .box{width:min(420px,92vw);padding:30px 32px;border:1px solid var(--flame-d);border-radius:8px;background:var(--shadow);text-align:center}
  #win h2{margin:0 0 6px;font-size:22px;color:var(--flame-m)}
  #win .st{margin:16px 0 22px;font:12px/1.9 var(--mono);color:var(--ink-dim)}
  #win .st b{color:var(--ink)}
  #win .row{display:flex;gap:8px;justify-content:center}
</style>
</head>
<body>
<div id="app">
  <section id="stage">
    <div id="board"><canvas id="cv" width="576" height="448"></canvas></div>
    <div id="hud">
      <span class="stat torch">🔥 torch <b id="hTorch">—</b></span>
      <span class="stat hp">hp <span class="pips" id="hHp"></span></span>
      <span class="stat">turn <b id="hTurn">0</b></span>
      <span class="stat" id="hPar"></span>
    </div>
    <div id="log"></div>
  </section>

  <aside id="panel">
    <div class="head">
      <span class="ch" id="pChap"></span>
      <h1 id="pTitle"></h1>
      <span class="n" id="pNum"></span>
    </div>
    <div id="brief">
      <div id="pBrief"></div>
      <div class="teach" id="pTeach"></div>
    </div>
    <div id="edwrap">
      <div id="edit">
        <div id="gutter"></div>
        <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </div>
      <div id="err">
        <div class="msg" id="errMsg"></div>
        <button class="tog" id="errTog">show the arcane text</button>
        <div class="raw" id="errRaw"></div>
      </div>
      <div id="bar">
        <button class="btn go" id="bRun">Cast ▶</button>
        <button class="btn" id="bReset">Reset</button>
        <button class="btn" id="bMap">Levels</button>
        <span class="sp" id="speedLbl"></span>
      </div>
    </div>
    <div id="book">
      <h2 id="bookH">Spellbook</h2>
      <dl id="bookList"></dl>
    </div>
  </aside>
</div>

<div id="map"><div class="in">
  <h1>Spellbound</h1>
  <div class="sub">An apprentice's grimoire. Choose a page.</div>
  <div id="mapBody"></div>
  <button class="btn close" id="mapClose">Back to the dungeon</button>
</div></div>

<div id="win"><div class="box">
  <h2 id="winH">The stair is yours</h2>
  <div id="winSub"></div>
  <div class="st" id="winSt"></div>
  <div class="row">
    <button class="btn go" id="winNext">Next level ▶</button>
    <button class="btn" id="winStay">Stay here</button>
  </div>
</div></div>

  solution:"function go(d,n){for(let i=0;i<n;i++){while(hero.see(d)==='goblin')hero.attack(d);hero.move(d);}}go('east',6);hero.take();if(hero.hp<8)hero.drink('potion');hero.move('east');hero.move('south');hero.move('south');for(let i=0;i<7;i++)hero.move('west');" },

{ id:13, chapter:'V · Spells of Your Own Making', title:'Inscribe a Spell', concept:'writing functions',
  torch:40, par:18,
  map:['##########','#@..#..>.#','#.#.#.##.#','#...#..#.#','###.####.#','#g....g..#','##########'],
  briefing:'A winding route: south, then east, then south, then a long fighting march east, then north again. Every leg is the same act repeated — do not write it out six times.',
  teaches:'A <b>function</b> is a spell you name yourself: <code>function clear(dir) { ... }</code> Call it as often as you like.',
  starter:"// One spell that walks a whole leg, fighting anything in the way.\nfunction go(dir, times) {\n  for (let i = 0; i < times; i++) {\n    \n  }\n}\n\n// then call go(...) for each leg of the route\n",
  solution:"function go(d,n){for(let i=0;i<n;i++){while(hero.see(d)==='goblin')hero.attack(d);hero.move(d);}}go('south',2);go('east',2);go('south',2);go('east',5);go('north',4);go('west',1);" },

{ id:14, chapter:'V · Spells of Your Own Making', title:'The Labyrinth of Sarn', concept:'an algorithm of your own',
  torch:120, par:24,
  map:[
   '###############',
   '#@..#.........#',
   '#.#.#.#######.#',
   '#.#...#.....#.#',
   '#.#####.###.#.#',
   '#.......#g#.#.#',
   '#.#######.#.#.#',
   '#.........#..>#',
   '###############'],
  briefing:'No one has mapped the Labyrinth of Sarn. You cannot count its paces or list its turns — you can only feel the wall at your left hand and never let go of it. Write that rule, and the maze solves itself.',
  teaches:'This is <b>an algorithm</b>: a rule small enough to write down that solves problems you have never seen. Keep your left hand on the wall.',
  starter:"// Left-hand wall following.\n// Turn left if you can, else go straight, else turn right, else turn back.\nconst LEFT  = { north:'west',  west:'south', south:'east',  east:'north' };\nconst RIGHT = { north:'east',  east:'south', south:'west',  west:'north' };\nlet facing = 'south';\n\nwhile (!hero.atExit()) {\n  \n}\n",

/* ------------------------------------------------------------------ world --- */

class Halt extends Error {
  constructor(kind, msg){ super(msg); this.kind = kind; this.msg = msg; }
}

function buildWorld(level){
  const h = level.map.length, w = level.map[0].length;
  const tiles = new Array(w*h).fill('floor');
  const ents = [], items = [];
  const doorsOpen = new Set();
  let hero = null;
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const ch = level.map[y][x], i = y*w+x;
    if (ch === '#') tiles[i] = 'wall';
    else if (ch === ',') tiles[i] = 'cracked';
    else if (ch === '>') tiles[i] = 'exit';
    else if (ch === 'D') tiles[i] = 'door';
    if (ch === '@') hero = { x, y };
    if (ch === 'g') ents.push({ type:'goblin', x, y, hp:GOBLIN_HP, dir:'south', dead:false });
    if (ch === 'k') items.push({ type:'key', x, y });
    if (ch === '!') items.push({ type:'potion', x, y });
    if (ch === 's') items.push({ type:'scroll', x, y });
  }
  return {
    w, h, tiles, ents, items, doorsOpen,
    hero: { x:hero.x, y:hero.y, dir:'south', hp:HERO_HP, inv:[], anim:0 },
    turns:0, torch:level.torch, won:false, frames:[], line:0,
  };
}

const at = (S,x,y) => (x<0||y<0||x>=S.w||y>=S.h) ? 'wall' : S.tiles[y*S.w+x];
const entAt = (S,x,y) => S.ents.find(e => !e.dead && e.x===x && e.y===y);
const itemAt = (S,x,y) => S.items.find(it => it.x===x && it.y===y);
const doorOpen = (S,x,y) => S.doorsOpen.has(y*S.w+x);

function look(S,x,y){
  const t = at(S,x,y);
  if (t === 'wall') return 'wall';
  if (t === 'door' && !doorOpen(S,x,y)) return 'door';
  const e = entAt(S,x,y); if (e) return e.type;
  const it = itemAt(S,x,y); if (it) return it.type;
  if (t === 'exit') return 'exit';
  return 'floor';
}

function snapshot(S, msg, cls, fx){
  S.frames.push({
    hero:{ x:S.hero.x, y:S.hero.y, dir:S.hero.dir, hp:S.hero.hp, anim:S.hero.anim },
    ents: S.ents.map(e => ({ type:e.type, x:e.x, y:e.y, dir:e.dir, hp:e.hp, dead:e.dead })),
    items: S.items.map(i => ({ type:i.type, x:i.x, y:i.y })),
    doors: [...S.doorsOpen],
    turns: S.turns, torch: S.torch - S.turns, line: S.line,
    msg: msg || null, cls: cls || '', fx: fx || null,
  });
}

/* ---------------------------------------------------------------- the API --- */

function makeApi(S, level){
  const snap = (msg, cls, fx) => snapshot(S, msg, cls, fx);
  const spend = () => {
    S.turns++;
    S.hero.anim ^= 1;
    if (S.turns > S.torch) throw new Halt('torch',
      `Turn ${S.turns} — your torch gutters out in the dark.`);
  };
  const goblinsStrike = () => {
    for (const e of S.ents){
      if (e.dead) continue;
      if (Math.abs(e.x-S.hero.x) + Math.abs(e.y-S.hero.y) === 1){
        S.hero.hp -= GOBLIN_DMG;
        snap(`A goblin claws you for ${GOBLIN_DMG}. (hp ${Math.max(0,S.hero.hp)})`, 'bad');
        if (S.hero.hp <= 0) throw new Halt('died', 'You fall in the dark. The dungeon keeps you.');
      }
    }
  };
  const afterTurn = () => {
    if (at(S, S.hero.x, S.hero.y) === 'exit'){
      S.won = true;
      snap('You set foot on the stair. The dark gives way.', 'win');
      throw new Halt('win','');
    }
    goblinsStrike();
  };
  const needDir = (d, fn) => {
    if (!DIRS[d]) throw new Halt('fatal',
      `${fn} needs a direction: 'north', 'south', 'east' or 'west'` +
      (d === undefined ? ` — you gave it nothing.` : ` — you gave it ${JSON.stringify(d)}.`));
    return DIRS[d];
  };

  const hero = {
    move(d){
      const v = needDir(d, "hero.move()");
      const nx = S.hero.x+v.x, ny = S.hero.y+v.y;
      const what = look(S, nx, ny);
      if (what === 'wall') throw new Halt('fatal',
        `You walk face-first into cold stone. There is a wall to the ${d} — check with hero.see('${d}') before you move.`);
      if (what === 'door') throw new Halt('fatal',
        `The door to the ${d} is shut. Open it first with hero.open('${d}').`);
      if (what === 'goblin') throw new Halt('fatal',
        `A goblin blocks the way ${d}. Strike it with hero.attack('${d}').`);
      S.hero.dir = d; S.hero.x = nx; S.hero.y = ny;
      spend(); snap(); afterTurn();
    },
    attack(d){
      const v = needDir(d, "hero.attack()");
      const e = entAt(S, S.hero.x+v.x, S.hero.y+v.y);
      S.hero.dir = d;
      if (!e) throw new Halt('fatal', `You swing at empty air to the ${d}. There is nothing there to fight.`);
      e.hp -= HERO_DMG;
      spend();
      if (e.hp <= 0){ e.dead = true; snap(`Your spell strikes true. The ${e.type} falls.`, 'hit',
                                          { kind:'slash', x:e.x, y:e.y }); }
      else snap(`You strike the ${e.type}. It reels but holds. (${e.hp} left)`, 'hit',
                { kind:'slash', x:e.x, y:e.y });
      afterTurn();
    },
    take(){
      const it = itemAt(S, S.hero.x, S.hero.y);
      if (!it) throw new Halt('fatal', 'There is nothing beneath your feet to pick up.');
      S.items.splice(S.items.indexOf(it), 1);
      S.hero.inv.push(it.type);
      spend(); snap(`You pocket the ${it.type}.`, 'say'); afterTurn();
    },
    open(d){
      const v = needDir(d, "hero.open()");
      const nx = S.hero.x+v.x, ny = S.hero.y+v.y;
      if (at(S,nx,ny) !== 'door') throw new Halt('fatal', `There is no door to the ${d}.`);
      if (doorOpen(S,nx,ny)) throw new Halt('fatal', `That door is already open.`);
      if (!S.hero.inv.includes('key')) throw new Halt('fatal',
        'The door is locked and you carry no key. Find one and hero.take() it.');
      S.doorsOpen.add(ny*S.w+nx);
      spend(); snap('The key turns. The door swings inward.', 'say'); afterTurn();
    },
    drink(what){
      if (what !== undefined && what !== 'potion') throw new Halt('fatal',
        `You have no ${what} to drink. Try hero.drink('potion').`);
      if (!S.hero.inv.includes('potion')) throw new Halt('fatal',
        'You carry no potion. Stand on one and hero.take() it first.');
      S.hero.inv.splice(S.hero.inv.indexOf('potion'), 1);
      S.hero.hp = Math.min(HERO_HP, S.hero.hp + 5);
      spend(); snap(`You drain the flask. (hp ${S.hero.hp})`, 'win'); afterTurn();
    },
    wait(){ spend(); snap('You wait, and listen.'); afterTurn(); },
    see(d){ const v = needDir(d, "hero.see()"); return look(S, S.hero.x+v.x, S.hero.y+v.y); },
    atExit(){ return at(S, S.hero.x, S.hero.y) === 'exit'; },
    has(item){ return S.hero.inv.includes(item); },
    get hp(){ return S.hero.hp; },
    get torch(){ return S.torch - S.turns; },
  };
  const log = (...vals) => {
    snap(vals.map(v => typeof v === 'object' ? JSON.stringify(v) : String(v)).join(' '), 'say');
  };
  return { hero, log };
}

/* --------------------------------------------------- guards + line tracking --- */

const SPELLS = ['move','attack','take','open','drink','wait','see','atExit','has','hp','torch'];

/** Insert a guard call at the top of every braced loop body. Adds no newlines,
    so reported line numbers still match what the player wrote. */
function instrument(src){
  let out = '', i = 0;
  const isWord = c => /[A-Za-z0-9_$]/.test(c);
  while (i < src.length){
    const c = src[i];
    // skip over strings, template literals and comments untouched
    if (c === '"' || c === "'" || c === '`'){
      const q = c; out += c; i++;
      while (i < src.length){ out += src[i];
        if (src[i] === '\\'){ out += src[++i] ?? ''; i++; continue; }
        if (src[i] === q){ i++; break; } i++; }
      continue;
    }
    if (c === '/' && src[i+1] === '/'){ while (i < src.length && src[i] !== '\n') out += src[i++]; continue; }
    if (c === '/' && src[i+1] === '*'){ out += '/*'; i += 2;
      while (i < src.length && !(src[i] === '*' && src[i+1] === '/')) out += src[i++];
      out += '*/'; i += 2; continue; }
    // loop keyword at a word boundary?
    const m = /^(while|for|do)\b/.exec(src.slice(i));
    if (m && !isWord(src[i-1] || ' ')){
      out += m[1]; i += m[1].length;
      if (m[1] !== 'do'){                       // step over the (...) header
        while (i < src.length && /\s/.test(src[i])) out += src[i++];
        if (src[i] === '('){ let depth = 0;
          do { if (src[i] === '(') depth++; else if (src[i] === ')') depth--; out += src[i++]; }
          while (i < src.length && depth > 0);
        }
      }
      while (i < src.length && /\s/.test(src[i])) out += src[i++];
      if (src[i] === '{'){ out += '{__g();'; i++; }
      continue;
    }
    out += c; i++;
  }
  return out;
}

/** Calibrate how many lines `new Function` prepends, so stacks map to user lines. */
let LINE_OFFSET = null;
function lineOffset(){
  if (LINE_OFFSET !== null) return LINE_OFFSET;
  let n = 2;
  try {
    const probe = new Function('return new Error();');
    const mm = /<anonymous>:(\d+):/.exec(probe().stack || '');
    if (mm) n = Number(mm[1]) - 1;
  } catch {}
  return (LINE_OFFSET = n);
}
function currentLine(){
  // Frame 0 is "Error", 1 is this function, 2 is the command wrapper; the
  // player's code is the first frame after those. Skipping a fixed depth keeps
  // this correct whether the engine is a real <script> or itself evaluated.
  const lines = (new Error().stack || '').split('\n');
  for (let i = 3; i < lines.length; i++){
    const m = /<anonymous>:(\d+):/.exec(lines[i]);
    if (m) return Math.max(1, Number(m[1]) - lineOffset());
  }
  return 0;
}

/* ---------------------------------------------------------------- running --- */

function balanceReport(src){
  const stack = [], pairs = { '}':'{', ')':'(', ']':'[' };
  let line = 1, i = 0;
  while (i < src.length){
    const c = src[i];
    if (c === '\n'){ line++; i++; continue; }
    if (c === '"' || c === "'" || c === '`'){ const q = c; i++;
      while (i < src.length && src[i] !== q){ if (src[i] === '\\') i++; if (src[i] === '\n') line++; i++; } i++; continue; }
    if (c === '/' && src[i+1] === '/'){ while (i < src.length && src[i] !== '\n') i++; continue; }
    if (c === '/' && src[i+1] === '*'){ i += 2;
      while (i < src.length && !(src[i] === '*' && src[i+1] === '/')){ if (src[i] === '\n') line++; i++; } i += 2; continue; }
    if (c === '{' || c === '(' || c === '[') stack.push({ c, line });
    else if (pairs[c]){
      const top = stack.pop();
      if (!top) return { line, msg: `This <b>${c}</b> on line ${line} has no matching <b>${pairs[c]}</b> to close.` };
      if (top.c !== pairs[c]) return { line, msg: `You opened <b>${top.c}</b> on line ${top.line} but closed it with <b>${c}</b> on line ${line}.` };
    }
    i++;
  }
  if (stack.length){ const t = stack[stack.length-1];
    return { line: t.line, msg: `You opened <b>${t.c}</b> on line ${t.line} and never closed it. Every <b>${t.c}</b> needs a matching <b>${ {'{':'}','(':')','[':']'}[t.c] }</b>.` }; }
  return null;
}

const editDistance = (a,b) => {
  const d = Array.from({length:a.length+1}, (_,i) => [i, ...Array(b.length).fill(0)]);
  for (let j=0;j<=b.length;j++) d[0][j] = j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
};
const didYouMean = (name) => {
  let best = null, bd = 99;
  for (const s of SPELLS){ const d = editDistance(name.toLowerCase(), s.toLowerCase()); if (d < bd){ bd = d; best = s; } }
  return bd <= Math.max(2, Math.floor(name.length/3)) ? best : null;
};

function translate(err, src, line){
  if (err instanceof Halt) return { msg: err.msg, line, raw: null };
  const raw = `${err.name}: ${err.message}`;
  const m = err.message || '';
  let mm;
  if (err instanceof SyntaxError){
    const bal = balanceReport(src);
    if (bal) return { msg: bal.msg, line: bal.line, raw };
    if (/Unexpected end of input/.test(m))
      return { msg: 'Your spell ends in the middle of something — a bracket or brace was never closed.', line: null, raw };
    if ((mm = /Unexpected token '?(.+?)'?$/.exec(m)))
      return { msg: `There is a stray <b>${mm[1]}</b> where the spell did not expect one.`, line: null, raw };
    if (/Invalid or unexpected token/.test(m))
      return { msg: 'A quote is unmatched — every <b>\'</b> needs a closing <b>\'</b>.', line: null, raw };
    return { msg: 'This is not written as a spell can be read. Check your brackets, braces and quotes.', line: null, raw };
  }
  if ((mm = /(?:hero\.)?(\w+) is not a function/.exec(m))){
    const s = didYouMean(mm[1]);
    return { msg: `There is no spell called <b>${mm[1]}</b>.` + (s ? ` Did you mean <b>${s}</b>?` : ''), line, raw };
  }
  if ((mm = /(\w+) is not defined/.exec(m))){
    const s = didYouMean(mm[1]);
    return { msg: `Nothing has been named <b>${mm[1]}</b> yet.` +
      (s ? ` Did you mean <b>hero.${s}</b>?` : ` Give it a value first, like <code>let ${mm[1]} = 0;</code>`), line, raw };
  }
  if (/Cannot read propert(y|ies) .* of (undefined|null)/.test(m))
    return { msg: 'You asked something of a value that does not exist yet.', line, raw };
  if (/Assignment to constant/.test(m))
    return { msg: 'You tried to change something declared with <b>const</b>. Use <b>let</b> if it must change.', line, raw };
  if (/Maximum call stack/.test(m))
    return { msg: 'A spell called itself without end, until your mind gave out.', line, raw };
  return { msg: 'The spell failed in a way the grimoire does not describe.', line, raw };
}

function runProgram(level, source){
  const S = buildWorld(level);
  const { hero, log } = makeApi(S, level);

  // wrap every command so each frame knows which line produced it
  const tracked = {};
  for (const k of Object.keys(hero)) {
    const v = hero[k];
    tracked[k] = (typeof v === 'function')
      ? function(...a){ S.line = currentLine(); return v.apply(hero, a); }
      : v;
  }
  for (const k of ['hp','torch'])
    Object.defineProperty(tracked, k, { get: () => hero[k] });

  const t0 = Date.now();
  let steps = 0;
  const guard = () => {
    if (++steps > 2_000_000 || (steps % 4096 === 0 && Date.now() - t0 > 2000))
      throw new Halt('torch', 'Your torch gutters out in the dark — that spell never ends.');
  };

  snapshot(S);                 // frame 0: the starting tableau

  let error = null;
  try {
    const fn = new Function('hero','log','__g', instrument(source));
    fn(tracked, log, guard);
  } catch (e){
    if (e instanceof Halt && e.kind === 'win'){ /* reached the stair */ }
    else error = translate(e, source, S.line);
  }
  if (!error && !S.won) error = { msg:'Your spell ran to its end, but you never reached the stair.', line:null, raw:null };
  return { won: S.won, frames: S.frames, error, turns: S.turns, torch: S.torch };
}
/*__SIM_END__*/
</script>

<script>
/* ============================================================================
   Renderer, editor and shell.
   ========================================================================== */
const TILE = 32, SCALE = 2, FRAME_MS = 170;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ------------------------------------------------------------- sprite load --- */
const IMG = {};
let ready = false;
function loadArt(){
  const names = Object.keys(ATLAS);
  if (!names.length) return Promise.resolve();
  return Promise.all(names.map(n => new Promise(res => {
    const im = new Image();
    im.onload = () => { IMG[n] = im; res(); };
    im.onerror = () => res();
    im.src = 'data:image/png;base64,' + ATLAS[n];
  })));
}
const draw = (name, x, y) => { const im = IMG[name]; if (im) ctx.drawImage(im, Math.round(x), Math.round(y)); };

/* --------------------------------------------------------------- app state --- */
const SAVE = 'spellbound.v1';
const store = {
  data: (() => { try { return JSON.parse(localStorage.getItem(SAVE)) || {}; } catch { return {}; } })(),
  save(){ try { localStorage.setItem(SAVE, JSON.stringify(this.data)); } catch {} },
  get unlocked(){ return this.data.unlocked || 1; },
  set unlocked(v){ this.data.unlocked = Math.max(this.unlocked, v); this.save(); },
  best(id){ return (this.data.best || {})[id]; },
  setBest(id, t){ this.data.best = this.data.best || {}; const b = this.data.best[id];
    if (b === undefined || t < b){ this.data.best[id] = t; this.save(); } },
  code(id){ return (this.data.code || {})[id]; },
  setCode(id, src){ this.data.code = this.data.code || {}; this.data.code[id] = src; this.save(); },
};

let level = null, world = null, play = null;

/* ------------------------------------------------------------------ render --- */
const hash = (x,y) => { let h = x*374761393 + y*668265263; h = (h ^ (h>>13)) * 1274126177; return (h ^ (h>>16)) >>> 0; };
const FLOORS = ['tile_floor_a','tile_floor_b','tile_floor_c'];

function isWall(S,x,y){ return at(S,x,y) === 'wall'; }

function drawStatic(S){
  for (let y=0;y<S.h;y++) for (let x=0;x<S.w;x++){
    const px = x*TILE, py = y*TILE, t = at(S,x,y);
    if (t === 'wall'){
      // a sconce on walls that face a room, spaced out and stable per tile
      const facing = at(S,x,y+1) !== 'wall' && y+1 < S.h;
      if (facing && hash(x,y) % 5 === 0) draw(torchFrame(), px, py);
      else draw('tile_wall', px, py);
      continue;
    }
    draw(t === 'cracked' ? 'tile_floor_cracked' : FLOORS[hash(x,y) % 3], px, py);
    if (t === 'exit') draw('tile_stairs_down', px, py);
  }
}
let flick = 0;
const torchFrame = () => 'tile_wall_torch_' + (flick % 2);

function drawFrame(f, prev, t){
  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  ctx.fillStyle = '#0b0910';
  ctx.fillRect(0,0,cv.width,cv.height);
  drawStatic(world);

  for (const d of f.doors){
    const x = d % world.w, y = (d - x) / world.w;
    draw('tile_door_open', x*TILE, y*TILE);
  }
  for (let y=0;y<world.h;y++) for (let x=0;x<world.w;x++)
    if (at(world,x,y) === 'door' && !f.doors.includes(y*world.w+x)) draw('tile_door_closed', x*TILE, y*TILE);

  for (const it of f.items) draw('item_' + it.type, it.x*TILE, it.y*TILE);

  const lerp = (a,b) => a + (b-a) * t;
  for (let i=0;i<f.ents.length;i++){
    const e = f.ents[i]; if (e.dead) continue;
    const p = prev && prev.ents[i] && !prev.ents[i].dead ? prev.ents[i] : e;
    draw(`goblin_walk_${e.dir}_0`, lerp(p.x,e.x)*TILE, lerp(p.y,e.y)*TILE);
  }

  const h = f.hero, ph = prev ? prev.hero : h;
  const hx = lerp(ph.x, h.x)*TILE, hy = lerp(ph.y, h.y)*TILE;
  let sprite = `hero_walk_${h.dir}_${h.anim}`;
  if (f.fx && f.fx.kind === 'slash') sprite = `hero_attack_${h.dir}`;
  else if (f.cls === 'bad') sprite = 'hero_hurt';
  draw(sprite, hx, hy);

  if (f.fx && f.fx.kind === 'slash'){
    const n = Math.min(2, Math.floor(t*3));
    draw('fx_slash_' + n, f.fx.x*TILE, f.fx.y*TILE);
  }

  // torchlight: warm pool around the hero, deep dark beyond
  const cx = hx + TILE/2, cy = hy + TILE/2;
  const warm = ctx.createRadialGradient(cx,cy,0, cx,cy,TILE*3.2);
  warm.addColorStop(0,'rgba(240,164,71,.16)');
  warm.addColorStop(1,'rgba(240,164,71,0)');
  ctx.fillStyle = warm; ctx.fillRect(0,0,world.w*TILE,world.h*TILE);
  const dark = ctx.createRadialGradient(cx,cy,TILE*1.6, cx,cy,TILE*6.5);
  dark.addColorStop(0,'rgba(6,5,10,0)');
  dark.addColorStop(.55,'rgba(6,5,10,.42)');
  dark.addColorStop(1,'rgba(6,5,10,.88)');
  ctx.fillStyle = dark; ctx.fillRect(0,0,world.w*TILE,world.h*TILE);
}

/* -------------------------------------------------------------------- hud --- */
function setHud(f){
  $('hTorch').textContent = Math.max(0, f.torch);
  $('hTurn').textContent = f.turns;
  const pips = [];
  for (let i=0;i<HERO_HP;i++) pips.push(`<span class="pip${i < f.hero.hp ? '' : ' off'}"></span>`);
  $('hHp').innerHTML = pips.join('');
  const b = store.best(level.id);
  $('hPar').innerHTML = `par <b>${level.par}</b>` + (b !== undefined ? ` · best <b>${b}</b>` : '');
}
function logLine(msg, cls){
  const el = document.createElement('div');
  el.className = 'l ' + (cls||''); el.textContent = msg;
  $('log').appendChild(el); $('log').scrollTop = $('log').scrollHeight;
}

/* ---------------------------------------------------------------- playback --- */
function stop(){ if (play){ cancelAnimationFrame(play.raf); play = null; } $('bRun').disabled = false; $('bRun').textContent = 'Cast ▶'; }

function startPlayback(result){
  const frames = result.frames;
  let i = 0, t0 = performance.now(), shown = -1;
  $('bRun').disabled = true; $('bRun').textContent = 'Casting…';

  const step = (now) => {
    const elapsed = now - t0;
    i = Math.min(frames.length - 1, Math.floor(elapsed / FRAME_MS));
    const t = Math.min(1, (elapsed - i*FRAME_MS) / FRAME_MS);
    flick = Math.floor(now / 320);

    if (i !== shown){
      shown = i;
      const f = frames[i];
      if (f.msg) logLine(f.msg, f.cls);
      setHud(f);
      markLine(f.line);
    }
    drawFrame(frames[i], i > 0 ? frames[i-1] : null, i > 0 ? t : 1);

    if (i >= frames.length - 1 && elapsed > frames.length * FRAME_MS){ finish(result); return; }
    play.raf = requestAnimationFrame(step);
  };
  play = { raf: requestAnimationFrame(step) };
}

function finish(result){
  stop(); markLine(0);
  if (result.won){
    store.unlocked = Math.min(LEVELS.length, level.id + 1);
    store.setBest(level.id, result.turns);
    showWin(result);
  } else if (result.error){
    showError(result.error);
    logLine('✗ ' + result.error.msg.replace(/<[^>]+>/g,''), 'bad');
  }
}

/* ------------------------------------------------------------------ errors --- */
function showError(e){
  const box = $('err');
  box.classList.add('show'); box.classList.remove('open');
  $('errMsg').innerHTML = (e.line ? `<b>Line ${e.line}</b> — ` : '') + e.msg;
  $('errTog').style.display = e.raw ? '' : 'none';
  $('errRaw').textContent = e.raw || '';
  if (e.line) markLine(e.line, true);
}
function clearError(){ $('err').classList.remove('show','open'); }
$('errTog').onclick = () => $('err').classList.toggle('open');

/* ------------------------------------------------------------------ editor --- */
const code = $('code'), gutter = $('gutter');
function syncGutter(){
  const n = code.value.split('\n').length;
  if (gutter.childElementCount !== n){
    gutter.innerHTML = Array.from({length:n}, (_,i) => `<div>${i+1}</div>`).join('');
  }
  gutter.scrollTop = code.scrollTop;
}
function markLine(n, keep){
  [...gutter.children].forEach((d,i) => d.classList.toggle('cur', n > 0 && i === n-1));
  if (keep && n > 0){
    const el = gutter.children[n-1];
    if (el) el.scrollIntoView({ block:'nearest' });
  }
}
code.addEventListener('input', () => { syncGutter(); clearError(); store.setCode(level.id, code.value); });
code.addEventListener('scroll', () => { gutter.scrollTop = code.scrollTop; });
code.addEventListener('keydown', e => {
  if (e.key === 'Tab'){
    e.preventDefault();
    const s = code.selectionStart, en = code.selectionEnd;
    code.value = code.value.slice(0,s) + '  ' + code.value.slice(en);
    code.selectionStart = code.selectionEnd = s + 2;
    syncGutter();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){ e.preventDefault(); run(); }
});

/* --------------------------------------------------------------- spellbook --- */
const BOOK = [
  ['hero.move(dir)',    'Walk one tile. Costs a turn.', 1],
  ['hero.see(dir)',     "What is in the next tile: 'wall', 'floor', 'door', 'goblin', 'key', 'potion', 'exit'. Free.", 6],
  ['hero.atExit()',     'True when you stand on the stair. Free.', 6],
  ['hero.take()',       'Pick up what lies under your feet. Costs a turn.', 5],
  ['hero.open(dir)',    'Open an adjacent door, if you carry its key. Costs a turn.', 5],
  ['hero.attack(dir)',  'Strike an adjacent creature. Costs a turn.', 8],
  ['hero.hp',           'Your health, out of 10. Free to read.', 12],
  ['hero.torch',        'Turns of torchlight left. Free to read.', 12],
  ['hero.drink(item)',  "Drink a potion you carry. Costs a turn.", 12],
  ['hero.has(item)',    "True if you carry it, e.g. hero.has('key'). Free.", 12],
  ['hero.wait()',       'Do nothing for a turn.', 9],
  ['log(value)',        'Speak a value into the adventure log. Free — your best debugging tool.', 10],
];
function renderBook(){
  $('bookList').innerHTML = BOOK.filter(b => level.id >= b[2])
    .map(b => `<dt>${b[0]}</dt><dd>${b[1]}</dd>`).join('');
}
$('bookH').onclick = () => $('book').classList.toggle('closed');

/* ------------------------------------------------------------------ levels --- */
function loadLevel(id){
  stop(); clearError();
  level = LEVELS.find(l => l.id === id) || LEVELS[0];
  world = buildWorld(level);
  cv.width = world.w*TILE*SCALE; cv.height = world.h*TILE*SCALE;
  ctx.imageSmoothingEnabled = false;

  $('pChap').textContent = level.chapter;
  $('pTitle').textContent = level.title;
  $('pNum').textContent = `${level.id} / ${LEVELS.length}`;
  $('pBrief').innerHTML = level.briefing;
  $('pTeach').innerHTML = level.teaches;
  $('log').innerHTML = '';
  logLine(`— ${level.title} —`);
  code.value = store.code(level.id) ?? level.starter;
  syncGutter(); renderBook();

  const f0 = { hero:{x:world.hero.x,y:world.hero.y,dir:'south',hp:HERO_HP,anim:0},
    ents: world.ents.map(e=>({...e})), items: world.items.map(i=>({...i})), doors:[],
    turns:0, torch:level.torch, line:0, msg:null, cls:'', fx:null };
  setHud(f0); drawFrame(f0, null, 1);
  $('speedLbl').textContent = 'Ctrl+Enter to cast';
}

function run(){
  if (play) return;
  clearError(); $('log').innerHTML = '';
  logLine(`— ${level.title} —`);
  const result = runProgram(level, code.value);
  if (result.frames.length <= 1 && result.error){ 
    drawFrame(result.frames[0], null, 1); setHud(result.frames[0]);
    showError(result.error); logLine('✗ ' + result.error.msg.replace(/<[^>]+>/g,''), 'bad');
    return;
  }
  startPlayback(result);
}
$('bRun').onclick = run;
$('bReset').onclick = () => { store.setCode(level.id, level.starter); loadLevel(level.id); };

/* --------------------------------------------------------------- map + win --- */
function renderMap(){
  let html = '', chap = null;
  for (const l of LEVELS){
    if (l.chapter !== chap){ chap = l.chapter;
      html += `${html ? '</div>' : ''}<div class="chap">${chap}</div><div class="grid">`; }
    const open = l.id <= store.unlocked, best = store.best(l.id);
    html += `<button class="card${best !== undefined ? ' done' : ''}" data-id="${l.id}"${open ? '' : ' disabled'}>
      <div class="t">${l.id}. ${open ? l.title : '???'}</div>
      <div class="c">${open ? l.concept : 'locked'}</div>
      <div class="s">${best !== undefined ? `best ${best} turns · par ${l.par}` : (open ? `par ${l.par}` : '&nbsp;')}</div></button>`;
  }
  $('mapBody').innerHTML = html + '</div>';
  $('mapBody').querySelectorAll('.card').forEach(b => b.onclick = () => {
    $('map').classList.remove('show'); loadLevel(Number(b.dataset.id));
  });
}
$('bMap').onclick = () => { renderMap(); $('map').classList.add('show'); };
$('mapClose').onclick = () => $('map').classList.remove('show');

function showWin(r){
  const last = level.id === LEVELS.length;
  $('winH').textContent = last ? 'The Labyrinth yields' : 'The stair is yours';
  $('winSub').textContent = last
    ? 'You wrote a rule small enough to hold in your head, and it solved a maze you had never seen. That is what programming is.'
    : level.teaches.replace(/<[^>]+>/g,'');
  const b = store.best(level.id);
  $('winSt').innerHTML =
    `turns <b>${r.turns}</b> &nbsp;·&nbsp; par <b>${level.par}</b> &nbsp;·&nbsp; best <b>${b}</b><br>` +
    `torch left <b>${r.torch - r.turns}</b> &nbsp;·&nbsp; lines <b>${code.value.trim().split('\n').length}</b>` +
    (r.turns <= level.par ? '<br><span style="color:var(--flame-m)">A clean cast.</span>' : '');
  $('winNext').style.display = last ? 'none' : '';
  $('win').classList.add('show');
}
$('winNext').onclick = () => { $('win').classList.remove('show'); loadLevel(Math.min(LEVELS.length, level.id+1)); };
$('winStay').onclick = () => $('win').classList.remove('show');

/* -------------------------------------------------------------------- boot --- */
loadArt().then(() => {
  ready = true;
  loadLevel(store.unlocked || 1);
  (function tick(){ if (!play){ flick = Math.floor(performance.now()/320); } requestAnimationFrame(tick); })();
});
</script>
